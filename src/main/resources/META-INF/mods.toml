modLoader = "javafml"
loaderVersion = "[47,)"
license = "${mod_license}"

# This is a URL to e.g. your GitHub or CurseForge issues page.
# It will appear in any crash reports this mod is directly involved in.
# issueTrackerURL="https://github.com/invalid/pleasechangeme/issues" #optional
# A list of mods - how many allowed here is determined by the individual mod loader

[[mods]]
    modId = "${mod_id}"
    version = "${version}"
    displayName = "${mod_name}"
    displayURL = "${mod_url}"
    # This will be displayed as your mod's logo in the Mods panel.
    # logoFile="icon.png" #optional
    # Some more fluff displayed in the Mods panel. Feel free to issue your special thanks here!
    # credits="Thanks to Mojang for making this great game" #optional
    # Some more fluff displayed in the Mods panel. Plug your stuff here!
    authors="${mod_author}"
    description = '''
GregTech Nexus Addon - a GTCEu Modern addon: wireless steam/energy networks, thread & parallel hatches, multi-mode ME pattern buffers, ported GTOCore/GTLAdditions multiblocks and late-game content.
'''

    [[dependencies.${mod_id}]]
        modId = "forge"
        mandatory = true
        versionRange = "[${forge_version},)"
        ordering = "NONE"
        side = "BOTH"
    [[dependencies.${mod_id}]]
        modId = "minecraft"
        mandatory = true
        versionRange = "[${minecraft_version},)"
        ordering = "NONE"
        side = "BOTH"
    [[dependencies.${mod_id}]]
        modId = "gtceu"
        mandatory = true
        versionRange = "[${gtceu_version},)"
        ordering = "AFTER"
        side = "BOTH"
    # Soft dependency: only the space multiblock content uses Ad Astra.
    # No GTNA class imports it, so the mod must load fine without it.
    [[dependencies.${mod_id}]]
        modId = "ad_astra"
        mandatory = false
        versionRange = "[1.15.20,)"
        ordering = "AFTER"
        side = "BOTH"
    # EN: Required: the ME parts (Pattern Buffers, ME Storage hatches) are always registered and import AE2 classes.
    # PT: Obrigatório: as peças ME (Pattern Buffers, hatches do ME Storage) são sempre registradas e importam classes do AE2.
    # ZH: 必需：ME 部件（样板总成、ME 存储仓）始终注册并引用 AE2 类。
    [[dependencies.${mod_id}]]
        modId = "ae2"
        mandatory = true
        versionRange = "[15.0.0,)"
        ordering = "AFTER"
        side = "BOTH"
    [[dependencies.${mod_id}]]
        modId = "gtialib"
        mandatory = true
        versionRange = "[${gtialib_version},)"
        ordering = "AFTER"
        side = "BOTH"
