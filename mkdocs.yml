site_name: GregTech Nexus Addon
site_url: https://gtinfinityascension.github.io/GregTech-Nexus-Addon/
site_description: "Player and pack-author documentation for GregTech Nexus Addon (GTNA), a GregTech CEu Modern addon for Minecraft 1.20.1."
site_author: Raishxn
repo_url: https://github.com/GTInfinityAscension/GregTech-Nexus-Addon
repo_name: GTInfinityAscension/GregTech-Nexus-Addon
edit_uri: edit/main/docs/
copyright: "Copyright &copy; 2024-2026 Raishxn and contributors · LGPLv3 code; see Credits for asset licenses"

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-4
        name: Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-7
        name: Dark mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - search.share
    - content.code.copy
    - content.action.edit
    - content.tabs.link
    - toc.follow
  icon:
    repo: fontawesome/brands/github
  logo: assets/logo.png
  favicon: assets/favicon.png

# EN: Working notes stay in the repo but are not published: they are internal and written in mixed languages.
# PT: As notas de trabalho ficam no repo, mas não viram página: são internas e escritas em várias línguas.
# ZH: 工作笔记保留在仓库中但不发布:它们是内部文档,语言混杂。
exclude_docs: |
  STATE.md
  curseforge-*.md
  prd/
  fixes/
  reports/
  style/
  update-notes/
  visualization/
  structures/
  development/pattern-buffer-task-manager.md
  roadmap/*
  !roadmap/index*.md
  !roadmap/design/
  roadmap/design/proposals/
  config-examples/

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

not_in_nav: |
  roadmap/design/*.md
  gameplay/machines/catalog/*.md

plugins:
  - search
  - tags
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: pt
          name: Português (Brasil)
          build: true
          site_description: "Documentação para jogadores e autores de modpack do GregTech Nexus Addon (GTNA), addon do GregTech CEu Modern para Minecraft 1.20.1."
          nav_translations:
            Home: Início
            Getting started: Primeiros passos
            Machines: Máquinas
            Catalog: Catálogo
            Systems: Sistemas
            Endgame: Fim de jogo
            Hatches and parts: Hatches e partes
            Materials: Materiais
            Pack authors: Autores de modpack
            Java API: API Java
            Contribute: Contribuir
        - locale: zh
          name: 简体中文
          build: true
          site_description: "GregTech Nexus Addon(GTNA)的玩家与整合包作者文档。GTNA 是 Minecraft 1.20.1 上 GregTech CEu Modern 的附属模组。"
          nav_translations:
            Home: 首页
            Getting started: 入门
            Machines: 机器
            Catalog: 图鉴
            Systems: 系统
            Endgame: 终局
            Hatches and parts: 仓室与部件
            Materials: 材料
            Pack authors: 整合包作者
            Java API: Java API
            Contribute: 参与贡献

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - def_list
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/GTInfinityAscension/GregTech-Nexus-Addon
    - icon: fontawesome/brands/discord
      link: https://discord.gg/TW5vugknk5

extra_css:
  - assets/css/custom.css

# EN: Page titles come from each page's first heading, so every language shows its own title.
# PT: O título de cada página vem do primeiro cabeçalho dela, então cada idioma mostra o seu.
# ZH: 页面标题取自各页面的第一个标题,因此每种语言显示自己的标题。
nav:
  - Home:
    - index.md
    - Getting started:
      - getting-started/installation.md
      - getting-started/first-steps.md
      - getting-started/configuration.md
      - getting-started/faq.md
    - changelog.md
  - Machines:
    - gameplay/machines/index.md
    - Catalog: gameplay/machines/catalog/index.md
    - gameplay/machines/steam-age.md
    - gameplay/machines/industrial-slaughterhouse.md
    - gameplay/machines/originals.md
  - Systems:
    - gameplay/systems/index.md
    - gameplay/systems/wireless-steam-network.md
    - gameplay/systems/nexus-energy-network.md
    - gameplay/systems/pattern-buffers.md
    - gameplay/systems/modules.md
    - gameplay/systems/void-mining.md
    - gameplay/systems/hydraulic-system.md
    - gameplay/systems/research-engine.md
    - gameplay/systems/item-effects.md
    - Endgame:
      - gameplay/systems/forge-of-gods.md
      - gameplay/systems/eye-of-harmony.md
      - gameplay/systems/bec.md
      - gameplay/systems/space-elevator.md
      - gameplay/systems/nano-forge.md
      - gameplay/systems/dyson-sphere.md
  - Hatches and parts:
    - gameplay/parts/index.md
    - gameplay/parts/huge-steam-bus.md
    - gameplay/parts/thread-hatch.md
    - gameplay/parts/accelerate-hatch.md
    - gameplay/parts/overclock-hatch.md
    - gameplay/parts/advanced-parallel-hatch.md
  - Materials:
    - gameplay/materials/index.md
  - Pack authors:
    - development/api/kubejs.md
    - Java API:
      - development/api/overview.md
      - development/api/machines.md
      - development/api/materials.md
  - Contribute:
    - development/index.md
    - development/translating.md
    - development/setup.md
    - development/architecture.md
    - development/contributing.md
    - roadmap/index.md
