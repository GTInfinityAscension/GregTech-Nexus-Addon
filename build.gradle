buildscript {
    repositories {
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        mavenCentral()
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id "idea"
    id "eclipse"
    id "maven-publish"
    id 'net.neoforged.moddev.legacyforge' version '2.0.91'
    id 'com.diffplug.spotless' version '7.0.2'
}

sourceSets {
    main.resources {
        srcDir 'src/generated/resources'
    }
    // GTLCore-style unit tests: plain main()-based classes (no JUnit). They only exercise
    // pure logic that does not require a Minecraft bootstrap (Int128, NumberUtils,
    // StructureSlicer, matcher rules; GTRecipe2IntBiMultiMap via a byte-for-byte mirror).
    test {
        java.srcDir 'src/test/java'
    }
}

repositories {
    flatDir { dirs 'libs' }
    mavenLocal()
    mavenCentral()
    maven {
        name = 'Commoble'
        url = 'https://maven.commoble.net/'
        content { includeGroup 'commoble.infiniverse' }
    }
    maven {
        name = 'GTCEu Maven'
        url = 'https://maven.gtceu.com'
        content {
            includeGroup 'com.gregtechceu.gtceu'
        }
    }
    maven {
        name = "Latvian"
        url = "https://maven.latvian.dev/releases"
        content {
            includeGroup "dev.latvian.mods"
        }
    }
    maven {
        name = "Architectury"
        url = "https://maven.architectury.dev/"
        content {
            includeGroup "dev.architectury"
        }
    }
    maven {
        name 'FirstDarkDev'
        url "https://maven.firstdark.dev/snapshots/"
    }
    maven {
        // Productive Bees (soft dependency; the bee-breeding module only registers when it loads)
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
    maven { // Registrate
        url = "https://maven.tterrag.com/"
        content {
            // need to be specific here due to version overlaps
            includeGroup("com.tterrag.registrate")
        }
    }
    maven {
        // Patchouli, JEI
        name = "BlameJared"
        url = "https://maven.blamejared.com/"
    }
    maven {
        url = "https://maven.theillusivec4.top/"
    }
    maven {
        // Curse Forge File
        url "https://cursemaven.com/"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        // EMI
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/"
    }
    maven {
        url = "https://thedarkcolour.github.io/KotlinForForge/"
    }
    maven {
        name = "Team Resourceful"
        url = "https://maven.teamresourceful.com/repository/maven-public/"
    }

}

version = mod_version
group = maven_group
base { archivesName = archives_base_name }
java { sourceCompatibility = targetCompatibility = JavaVersion.VERSION_17 }

legacyForge {
    version = project.minecraft_version + '-' + project.forge_version

    parchment {
        mappingsVersion = project.mapping_version
        minecraftVersion = project.minecraft_version
    }

    runs {
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG

            // Force XWayland (X11) backend on Linux to avoid GLFW 0x1000C crashes under Wayland
            environment 'XDG_SESSION_TYPE', 'x11'
            environment 'GDK_BACKEND', 'x11'
        }
        client {
            client()
            sourceSet = sourceSets.main
            systemProperty('forge.enabledGameTestNamespaces', project.mod_id)
            // ./gradlew runClient -PquickPlay="New World" opens that save directly (smoke tests).
            if (project.hasProperty('quickPlay')) programArguments.addAll('--quickPlaySingleplayer', project.quickPlay)
        }
        server {
            server()
            sourceSet = sourceSets.main
            systemProperty('forge.enabledGameTestNamespaces', project.mod_id)
            programArguments.addAll('--nogui', '--world', 'world-extra')
        }
        // Runs every @GameTest in the gtna namespace headlessly, then exits.
        // Structures live in src/main/resources/data/gtna/structures/*.nbt.
        gameTestServer {
            type = "gameTestServer"
            sourceSet = sourceSets.main
            systemProperty('forge.enabledGameTestNamespaces', project.mod_id)
        }
        data {
            data()
            sourceSet = sourceSets.main
            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll('--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath())
            programArguments.addAll('--existing-mod', 'gtceu')
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // mostly optional in a single mod project
        // but multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}
jar {
    manifest.attributes([
            "MixinConfigs": "gtna.mixins.json"
    ])
}

apply from: "$rootDir/gradle/scripts/spotless.gradle"

// Unit tests (GTLCore pattern): each test class exposes `public static void main` and throws
// AssertionError on failure. We compile them against main's output + compile classpath (which
// already carries Guava, annotations, etc.) and run every *Test main in sequence.
tasks.register('runUnitTests') {
    group = 'verification'
    description = 'Runs GTLCore-style main()-based unit tests (no Minecraft bootstrap).'
    dependsOn 'compileJava', 'compileTestJava'
    def testClasses = [
            'com.raishxn.gtna.Int128Test',
            'com.raishxn.gtna.NexusPlannerTest',
            'com.raishxn.gtna.ModeIdMatcherTest',
            'com.raishxn.gtna.NumberUtilsTest',
            'com.raishxn.gtna.StructureSlicerTest',
            'com.raishxn.gtna.GTRecipe2IntBiMultiMapTest',
            'com.raishxn.gtna.PatternBufferModeSelectionTest',
            'com.raishxn.gtna.BufferModeSwitchPolicyTest',
            'com.raishxn.gtna.ConfigLangKeysTest',
            'com.raishxn.gtna.JadeLangKeysTest',
            'com.raishxn.gtna.AssetLangCoverageTest',
            'com.raishxn.gtna.SteamWiringContractTest',
            'com.raishxn.gtna.BuildDependencyContractTest',
            'com.raishxn.gtna.DataGeneratorMixinContractTest',
            'com.raishxn.gtna.ProductionMixinTargetContractTest',
            'com.raishxn.gtna.PartAbilityCoverageTest',
            'com.raishxn.gtna.RegistrationContractTest',
            'com.raishxn.gtna.PortLangParityTest',
            'com.raishxn.gtna.CtmConnectionContractTest',
            'com.raishxn.gtna.IconSetNamespaceTest',
            'com.raishxn.gtna.PortChainClosureTest',
            'com.raishxn.gtna.MultiblockTooltipStandardTest',
            'com.raishxn.gtna.ControllerRecipePolicyTest',
            'com.raishxn.gtna.OutputBoostContractTest',
            'com.raishxn.gtna.AccelerateHatchMathTest',
            'com.raishxn.gtna.StellarCoreTest',
            'com.raishxn.gtna.ColliderCoreTest',
            'com.raishxn.gtna.RiftCoreTest',
            'com.raishxn.gtna.LanceCoreTest',
            'com.raishxn.gtna.EyeOfHarmonyMathTest',
            'com.raishxn.gtna.OverclockHatchMathTest',
            'com.raishxn.gtna.IntegratedOreMathTest',
            'com.raishxn.gtna.UniversalFactoryBudgetTest',
            'com.raishxn.gtna.NexusWirelessLossTest',
            'com.raishxn.gtna.GodforgeMathTest',
            'com.raishxn.gtna.ClientMixinContractTest',
            'com.raishxn.gtna.SteamBalanceTooltipTest',
            'com.raishxn.gtna.MaterialSetAssetContractTest',
            'com.raishxn.gtna.OriginalsLangKeysTest',
            'com.raishxn.gtna.common.machine.multiblock.part.ae.PatternBufferLayoutTest',
    ]
    doLast {
        testClasses.each { String cls ->
            javaexec {
                classpath = sourceSets.test.runtimeClasspath
                mainClass.set(cls)
            }
            println "[runUnitTests] ${cls} OK"
        }
    }
}

tasks.register('plannerQa', JavaExec) {
    group = 'verification'
    description = 'Measures Nexus Planner p50/p95 latency and plan replay on reproducible graphs.'
    dependsOn 'compileTestJava'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.raishxn.gtna.planner.benchmark.PlannerBenchmark'
    args layout.buildDirectory.file('reports/planner/benchmark.csv').get().asFile.absolutePath
    jvmArgs '-Xms256m', '-Xmx1g'
}

tasks.named('check').configure { dependsOn 'runUnitTests' }

dependencies {
    // Mapped GTIACore jar for integrated dev testing; never bundled or required by GTNA.
    if (project.hasProperty('gtiaDevJar')) {
        runtimeOnly files(project.property('gtiaDevJar'))
    }
    def isDataRun =gradle.startParameter.taskNames.any { it.toLowerCase(java.util.Locale.ROOT).contains("rundata") }

    compileOnly("org.jetbrains:annotations:26.0.1")
    // Mixin
    annotationProcessor('org.spongepowered:mixin:0.8.5:processor')

    // Unit tests: fastutil + Guava for production classes they exercise (NumberUtils uses
    // LongMath). The test source set does not inherit the Minecraft libraries that normally
    // provide them; these are the MC 1.20.1 versions.
    testImplementation("it.unimi.dsi:fastutil:8.5.9")
    testImplementation("com.google.guava:guava:32.1.2-jre")
    testImplementation("org.ow2.asm:asm:9.8")
    // Bytecode contract of the optional EOH-only recipe-screen hook, without starting Minecraft.
    testRuntimeOnly("maven.modrinth:emi:1.1.13+1.20.1+forge")

    // JEI, EMI, Jade
    modCompileOnly("maven.modrinth:emi:1.1.13+1.20.1+forge")
    if (project.hasProperty("eohEmiQA")) modRuntimeOnly("maven.modrinth:emi:1.1.13+1.20.1+forge")
    modCompileOnly("mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}")
    modCompileOnly("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
    modRuntimeOnly("mezz.jei:jei-${minecraft_version}-forge:${jei_runtime_version}")
    modCompileOnly("curse.maven:jade-324717:5390389")
    // Optional team ownership integration; never bundled or required by GTNA.
    modCompileOnly("curse.maven:ftb-library-forge-404465:8226927")
    modCompileOnly("curse.maven:ftb-teams-forge-404468:7499810")
    // Optional quest-task integration (research nodes); never bundled or required by GTNA.
    modCompileOnly("curse.maven:ftb-quests-forge-289412:8078538")
    if (!isDataRun) {
        modRuntimeOnly("curse.maven:jade-324717:5390389")
        // Dev-only building/QoL utilities requested by the author. Not required dependencies:
        // modRuntimeOnly keeps them out of the published mod's manifest.
        modRuntimeOnly("curse.maven:building-gadgets-298187:6850495")
        modRuntimeOnly("curse.maven:ftb-chunks-forge-314906:8216874")
        modRuntimeOnly("curse.maven:ftb-library-forge-404465:8226927")
        modRuntimeOnly("curse.maven:ftb-teams-forge-404468:7499810")
        modRuntimeOnly("curse.maven:ftb-quests-forge-289412:8078538")
        modRuntimeOnly("curse.maven:architectury-api-419699:5137938")
    }

    // GregTech and dependencies
    // Dev only: ModernSpace (the standalone PersonalSpace) needs Infiniverse; GTNA no longer depends on it.
    modRuntimeOnly("commoble.infiniverse:infiniverse-1.20.1:1.0.0.5") { transitive = false }
    if (file('libs/modernspace-0.2.0.jar').exists()) {
        modRuntimeOnly('local:modernspace:0.2.0')
    }
    modImplementation("com.gregtechceu.gtceu:gtceu-${minecraft_version}:${gtceu_version}:slim") { transitive = false }
    modImplementation("com.lowdragmc.ldlib:ldlib-forge-${minecraft_version}:${ldlib_version}") { transitive = false }
    modImplementation("com.tterrag.registrate:Registrate:${registrate_version}")

    // lombok
    compileOnly 'org.projectlombok:lombok:1.18.24'
    annotationProcessor 'org.projectlombok:lombok:1.18.24'
    //extendedAE and Glodium
    modImplementation("curse.maven:glodium-957920:5226922")
    modImplementation("curse.maven:ex-pattern-provider-892005:7248944")
    //ae2 and guideme
    modImplementation("curse.maven:applied-energistics-2-223794:7148487")
    modImplementation("curse.maven:guideme-1173950:7127447")

    modImplementation("curse.maven:configuration-444699:5840405")

    // KubeJS soft dependency
    modCompileOnly("dev.latvian.mods:kubejs-forge:2001.6.5-build.26")
    modRuntimeOnly("dev.latvian.mods:kubejs-forge:2001.6.5-build.26")
    modCompileOnly("dev.latvian.mods:rhino-forge:2001.2.2-build.17")
    modRuntimeOnly("dev.latvian.mods:rhino-forge:2001.2.2-build.17")
    modRuntimeOnly("dev.architectury:architectury-forge:9.1.12")

    // Productive Bees soft dependency. The Steam Bee Breeding module is registered only when
    // Productive Bees is loaded (see GTNAMachines2), so players are never forced to install it; the
    // dev runs load it so the integration is covered by runData/runGameTestServer.
    modCompileOnly("maven.modrinth:productivebees:1.20.1-12.6.0")
    modRuntimeOnly("maven.modrinth:productivebees:1.20.1-12.6.0")

    modImplementation("curse.maven:gtceu-terminals-1423461:7787678")

    // Space multiblocks ported from GTLAdditions.
    runtimeOnly("com.teamresourceful:yabn:1.0.3")
    runtimeOnly("com.teamresourceful:bytecodecs:1.0.2")
    modImplementation("com.teamresourceful.resourcefullib:resourcefullib-forge-${minecraft_version}:${resourcefullib_version}")
    modImplementation("com.teamresourceful.resourcefulconfig:resourcefulconfig-forge-${minecraft_version}:${resourcefulconfig_version}")
    modImplementation("earth.terrarium.botarium:botarium-forge-${minecraft_version}:${botarium_version}")
    modImplementation("earth.terrarium.adastra:ad_astra-forge-${minecraft_version}:${ad_astra_version}") { transitive = false }
    modImplementation("curse.maven:stargate-journey-689083:${stargate_journey_file}") { transitive = false }

    modCompileOnly("curse.maven:modern-ui-352491:6956345")
    if (!isDataRun) {
        modRuntimeOnly("curse.maven:modern-ui-352491:6956345")
    }
}

// See com.example.examplemod.mixin.DummyMixin for information about mixins
mixin {
    add sourceSets.main, "mixins.${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

tasks.named('processResources', ProcessResources).configure {
    duplicatesStrategy = DuplicatesStrategy.WARN
    var properties = [
            "mod_license": mod_license,
            "mod_id": mod_id,
            "version": version,
            "mod_name": mod_name,
            "mod_url": mod_url,
            "mod_author": mod_author,
            "forge_version": forge_version.split("\\.")[0], // only specify major version of forge
            "minecraft_version": minecraft_version,
            "gtceu_version": gtceu_version,
    ]
    inputs.properties(properties)

    filesMatching("META-INF/mods.toml") {
        expand properties + [project: project]
    }

    doLast {
        def manualEnUs = file("src/main/resources/assets/gtna/lang/en_us.json")
        def generatedEnUs = file("src/generated/resources/assets/gtna/lang/en_us.json")
        def mergedEnUs = file("$destinationDir/assets/gtna/lang/en_us.json")
        def slurper = new groovy.json.JsonSlurper()
        Map<String, Object> merged = [:]

        if (manualEnUs.exists()) {
            merged.putAll(slurper.parse(manualEnUs) as Map<String, Object>)
        }
        if (generatedEnUs.exists()) {
            merged.putAll(slurper.parse(generatedEnUs) as Map<String, Object>)
        }

        if (!merged.isEmpty()) {
            mergedEnUs.parentFile.mkdirs()
            mergedEnUs.text = groovy.json.JsonOutput.prettyPrint(
                    groovy.json.JsonOutput.toJson(new TreeMap<>(merged))
            ) + System.lineSeparator()
        }
    }
}

tasks.named('jar', Jar).configure { finalizedBy 'reobfJar' }
tasks.withType(JavaCompile).configureEach {
    // ensure that the encoding is set to UTF-8, no matter what the system default is
    // this fixes some edge cases with special characters not displaying correctly
    // see http://yodaconditions.net/blog/fix-for-java-file-encoding-problems-with-gradle.html
    // If Javadoc is generated, this must be specified in that task too.
    options.encoding = "UTF-8"
    options.release.set(17)
    options.compilerArgs << "-Aquiet=true" // Suppress mixin notes
}

tasks.withType(JavaExec).configureEach {
    environment 'XDG_SESSION_TYPE', 'x11'
    environment 'GDK_BACKEND', 'x11'
}

tasks.register('installIntegratedOreKubeJSExample', Copy) {
    description = 'Installs the Integrated Ore Processor KubeJS example in the local dev run.'
    from('examples/kubejs/server_scripts/gtna_integrated_ore_module.js')
    from('examples/kubejs/server_scripts/gtna_multiple_recipes_module.js')
    into('run/kubejs/server_scripts')
}
tasks.named('runClient').configure {
    dependsOn 'installIntegratedOreKubeJSExample'
}
